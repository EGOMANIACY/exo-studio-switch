name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Build the exe
        run: pyinstaller --onefile --noconsole --name "EXO Studio Switch" studio_switch.py

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/EXO Studio Switch.exe" --title "${{ github.ref_name }}" --notes "Download EXO Studio Switch.exe and run it."

      - uses: actions/upload-artifact@v7
        with:
          name: EXO Studio Switch
          path: dist/EXO Studio Switch.exe
